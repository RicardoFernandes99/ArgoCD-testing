server {
    listen 80;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Forward API calls to the "api" Service in the same namespace.
    # The browser only talks to web, so there is no CORS to deal with.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}

# Rendered at container start by the nginx image (templates + envsubst).
# NGINX_LOCAL_RESOLVERS is filled in from /etc/resolv.conf (the cluster DNS).
server {
    listen 80;

    # Look "api" up per request instead of once at startup, so web starts
    # even before api exists and keeps up if the Service changes.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_upstream http://api.demo.svc.cluster.local:8080;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Forward API calls to the "api" Service.
    # The browser only talks to web, so there is no CORS to deal with.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}

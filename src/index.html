<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitOps demo app</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #1b2a3a; color: #fff; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; margin: 0 0 1rem; }
    .version { display: inline-block; padding: .4rem .9rem; border-radius: 999px;
               background: #18be94; color: #0b1a14; font-family: monospace; font-size: 1.1rem; }
    p { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from GitOps!</h1>
    <span class="version">version: __APP_VERSION__</span>
    <p>Built by GitHub Actions, deployed by Argo CD.</p>
  </main>
</body>
</html>

# CI half of the GitOps loop:
#   1. build the image from src/ and push it to GHCR, tagged with the commit SHA;
#   2. write the new tag into app/deployment.yaml and commit it to main.
# Argo CD sees that commit and deploys it. CI never talks to the cluster.
name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-and-deploy.yaml"
  workflow_dispatch:

# One run at a time, so two manifest commits never race each other.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

permissions:
  contents: write   # commit the new image tag
  packages: write   # push to GHCR

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name and tag
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/argocd-demo-app" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.image.outputs.tag }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

      - name: Update the image tag in the manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          sed -i -E "s|^(\s*image:).*|\1 ${IMAGE}|" app/deployment.yaml
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy demo-app ${{ steps.image.outputs.tag }}"
          # main may have moved while we were building.
          git pull --rebase origin main
          git push origin HEAD:main

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: argocd-poc
spec:
  replicas: 4
  # Short deadline so a broken rollout turns "Degraded" quickly during the demo.
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: argocd-poc
    spec:
      containers:
        - name: web
          # The tag is updated by CI (.github/workflows/web.yaml).
          image: ghcr.io/ricardofernandes99/argocd-demo-web:sha-doesnotexist
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: argocd-poc
spec:
  # NodePort 30081 is mapped by kind to localhost:8081 (see scripts/bootstrap.sh).
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081

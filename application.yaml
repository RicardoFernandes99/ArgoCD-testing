apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RicardoFernandes99/ArgoCD-testing.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true     # delete resources that were removed from Git
      selfHeal: true  # revert manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
